spring:
  application:
    name: dearus
  config:
    # server/.env 가 있으면 읽어요 (DB 주소 · 비밀번호). .env는 git에 올라가지 않아요.
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      # Supabase Session pooler는 동시에 붙을 수 있는 연결 수가 적어서, 여럿이 로컬에서 켜도 모자라지 않게 작게 둬요
      maximum-pool-size: 5
  jpa:
    open-in-view: false
    hibernate:
      # 테이블은 Flyway(db/migration)로만 만들고, 코드의 엔티티가 테이블과 맞는지만 검사해요
      ddl-auto: validate
  flyway:
    enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
    ttl-days: 14
  auth:
    # 로컬 개발에서만 true. 가짜 로그인(POST /auth/dev)을 켜요. 배포 서버에서는 꺼 두어요.
    dev-login-enabled: ${DEV_LOGIN_ENABLED:false}
    kakao:
      # 카카오 개발자 콘솔의 앱 ID(숫자)예요. 카카오 access token이 우리 앱에서 발급된 것인지 확인하는 데 써요. 비워 두면 카카오 로그인은 501이에요.
      app-id: ${KAKAO_APP_ID:}
    google:
      # 구글 ID token의 대상(aud)으로 받아들일 클라이언트 ID 목록이에요(쉼표로 구분). 비워 두면 구글 로그인은 501이에요.
      client-ids: ${GOOGLE_CLIENT_IDS:}
  admin:
    # 관리자 페이지(/admin) 비밀번호예요(2026.11.25). 16자 이상, 비워 두면 관리자 페이지가 꺼져요(404 ADMIN_DISABLED).
    password: ${ADMIN_PASSWORD:}
    # 관리자 토큰이 유지되는 시간
    token-hours: 8
  crypto:
    # 메신저 요약처럼 암호화해서 저장하는 값의 키예요(AES-256-GCM). base64로 인코딩한 32바이트이고, 서버가 바뀌어도 같은 값을 써야 저장된 값을 읽어요.
    key: ${ENCRYPTION_KEY}
  ai:
    # anthropic: Claude Haiku 5.5 호출 / fake: 키 없이 가짜 응답(로컬 개발 · 테스트용). 배포 서버에서는 anthropic이에요.
    provider: ${AI_PROVIDER:anthropic}
    api-key: ${ANTHROPIC_API_KEY:}
    model: claude-haiku-5-5
    timeout-seconds: 90
  safety:
    # 대화에서 위기 신호를 감지했을 때 내려주는 상담전화예요. 번호는 설정이라 앱 배포 없이 바꿀 수 있어요.
    # 두 번호 모두 24시간이고, 공식 안내로 확인했어요(2026.11.8).
    hotlines:
      - name: 자살예방 상담전화
        phone: "109"
        hours: 24시간
      - name: 정신건강 위기상담전화
        phone: 1577-0199
        hours: 24시간

  jobs:
    # 서버가 켜질 때 새벽 삭제 작업을 한 번 더 돌려요(StartupJobs). Render 무료 요금제는 잠들어서 새벽 작업을 건너뛸 수 있어서 배포 서버만 true예요.
    run-on-startup: ${JOBS_RUN_ON_STARTUP:false}

  limits:
    # AI 비용 · 남용을 막는 상한(2026.11.25 결정). 하루는 한국 시간 자정 기준이고, 넘치면 429예요.
    daily-chat-messages: 200
    chat-messages-per-session: 100
    daily-messenger-uploads: 5
    daily-reports: 20
    # 1분 단위 요청 수. 로그인은 IP별, 나머지는 로그인한 사람별이에요(서버 메모리에서 세요)
    login-per-minute: 10
    requests-per-minute: 120

  usage:
    # 화면 상단 "하루 30분 정도를 권장해요"의 권장 시간(분). 스토리보드 문구를 그대로 가정한 값이에요.
    recommended-minutes: 30

server:
  port: ${PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
