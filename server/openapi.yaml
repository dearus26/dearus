openapi: 3.0.3
info:
  title: Dear Us API
  version: 0.1.0-draft
  description: |
    앱(`app/`)과 서버(`server/`)가 주고받는 요청 · 응답 형태 초안이에요.
    ERD(`DearUs_ERD.html`), 기능 블록도(`DearUs_기능블록도.html`), 스토리보드(`DearUs_스토리보드.html`)의 화면별 데이터를 기준으로 정했어요.

    ## 공통 규칙

    | 항목 | 규칙 |
    |---|---|
    | 형식 | JSON(UTF-8). 필드 이름은 camelCase, enum 값은 UPPER_SNAKE_CASE |
    | 날짜 | 날짜만 필요하면 `2026-10-06`, 시각은 ISO 8601에 시간대를 붙여요 (`2026-10-06T21:30:00+09:00`). 서버는 한국 시간(+09:00)으로 내려줘요 |
    | ID | 일기 · 세션 · 커플 등은 UUID 문자열, 채팅 메시지는 정수 `seq`로 순서를 매겨요 |
    | 인증 | `Authorization: Bearer <JWT>`. 로그인 API만 헤더가 없어요. 갱신 토큰은 없고(ERD에 저장 테이블이 없어요), 만료되면 401을 받고 다시 로그인해요 |
    | 오류 | 모든 오류는 `{ code, message, details? }` 형태예요. `code`로 분기하고 `message`는 그대로 화면에 보여줘도 되는 해요체 문장이에요 |
    | 기준 | `x-schedule`은 일정표(10월~12월)에서 서버가 만들 시기, `x-screen`은 이 API를 쓰는 스토리보드 화면이에요 |

    ## 흐름 요약

    - **로그인 · 동의:** `POST /auth/{provider}` → 응답의 `user.needsConsent`가 `true`면 동의 화면을 보여주고 `PUT /me/consent`로 동의를 기록해요. 설정에서 철회는 `DELETE /me/consent`예요.
    - **일기:** `POST /diaries` → 홈에서 `GET /diaries?from&to`로 한 달치를 받아 캘린더에 표시해요.
    - **메신저(카톡 등) 업로드:** 사진은 폰 밖으로 보내지 않아요(2026.10.28 결정). 앱이 폰 안에서 글자를 읽고 가린 뒤 `POST /uploads/messenger`(202)로 **가린 글자만** 보내고, `GET /uploads/messenger/{id}`를 1~2초 간격으로 조회해 `DONE`이 되면 분석 완료 화면을 보여줘요.
    - **대화:** 하단 탭 "과거의 나"에서 `GET /chats`로 지난 대화 목록을 보고 다시 들어가거나, 새로 하려면 `GET /personas/shortcuts`(1개월 · 6개월 · 1년 전, 전후 2주)나 `GET /personas/preview`(캘린더에서 고른 날, 그날 하루)로 시점을 고르고 → `POST /chats`로 세션을 만들고(필요하면 `PREPARING`) → `POST /chats/{id}/messages`(SSE)로 대화하고 → `POST /chats/{id}/end` → `GET /chats/{id}/report`.
    - **커플:** `POST /couples/invite` → 상대가 `POST /couples/invite/accept` → 각자 `POST /couples/consent` → `GET /couples/days`로 함께 볼 날을 고르고 → 각자 `POST /chats`(`forCouple: true`)로 그날의 나와 대화한 뒤 끝내면 → `GET /couples/comparisons`로 두 사람의 기억과 간극을 보고 → 철회는 `POST /couples/revoke`.

    ## 기술스택 문서와 달라진 점

    - `POST /chats`는 세션 생성만 하고, 스트리밍은 `POST /chats/{chatId}/messages`로 옮겼어요. 시점 분석이 오래 걸릴 수 있어서 "준비 중" 상태를 따로 둬야 했어요.
    - 코드 입력 화면용 `POST /couples/invite/accept`, 시점 선택용 `/personas/*`, "과거의 나" 목록용 `GET /chats`, 커플 같은 날 비교용 `/couples/days` · `/couples/comparisons`, 설정 화면용 `/me`를 추가했어요.

    ## 결정한 것

    - **사진은 폰 밖으로 보내지 않아요(2026.10.28 결정):** 글자 읽기(OCR), 자동 가림, 내 말풍선 구분, 검수 · 직접 가리기는 모두 앱이 폰 안에서 해요. 서버는 사진을 받는 API가 없고(이미지를 보내면 415) 가린 글자(JSON)만 받아요. 그래서 ERD에 사진 · 가림 영역 테이블이 없고, `messenger_uploads`에 개수(`photo_count`, `masked_count`, `user_masked_count`)와 서버가 한 번 더 가린 건수(`server_masked_count`)만 남겨요. 상대 메시지는 폰에서 버려져 서버에 오지 않아요.
    - **AI 모델은 Claude Haiku 5.5예요(2026.10.28 결정):** 글자(텍스트)만 보내고 서버에서만 호출해요. 보낸 글자는 Anthropic 서버에서 30일 안에 삭제돼요(정책 위반으로 걸리면 최대 2년). 이미 보낸 글자는 그 기간만큼 남아요. 우리 서버도 철회 뒤 30일 보관한 뒤 지우니까 동의 화면에 "철회하면 약 30일 뒤 모두 지워져요"로 한 번에 안내할 수 있어요. 한국어 말투 품질은 시험으로 확인하고 모자라면 모델을 바꿔요(서버의 호출부가 인터페이스라 API 명세는 그대로예요).
    - **내 말풍선 구분:** 카카오톡은 오른쪽 · 노란색 말풍선이 나예요(앱이 글자 위치와 색으로 구분). 디스코드처럼 말풍선이 없는 앱은 내 이름이 필요해서 뒤로 미뤄요(첫 지원은 카카오톡). 예전 txt 방식의 `422 KAKAO_SPEAKER_REQUIRED`(내 이름 고르기)는 쓰지 않아요.
    - **동의 기록:** 스토리보드의 "서비스 이용 동의" 화면은 필수 3개(이용약관 · 개인정보 · AI 분석)를 한 번에 받고 "동의 시각을 기록"해요. 그래서 시각은 `users.ai_consent_at` 하나에 기록하고, 선택 항목인 알림만 `users.notifications_opt_in` 컬럼을 추가했어요. 스토리보드에 적힌 `POST /users/consent`는 내 계정 API를 `/me` 아래로 모으려고 `PUT /me/consent`로 정했어요. 이용약관과 개인정보 동의 시각을 따로 남겨야 하면 그때 컬럼을 나눠요.
    - **동의 철회:** 설정의 철회는 AI 분석 동의만 대상이에요(`DELETE /me/consent`). 철회하면 AI를 부르는 API는 403 `AI_CONSENT_REQUIRED`가 되고, 일기는 계속 쓸 수 있어요. 저장된 분석 데이터(메신저 요약 · 시점 분석)와 대화 기록(세션 · 메시지)은 바로 지우지 않고 철회한 날부터 **30일 동안 보관**해요(2026.10.29 결정). 그 안에 다시 동의하면(`PUT /me/consent`) 보관하던 분석과 대화를 이어서 쓰고, 30일이 지나면 서버가 자동으로 지워요. 일기는 지우지 않아요. 보관 중에도 지난 대화는 볼 수 있고(`GET /chats`), 올린 메신저 대화는 직접 지울 수 있어요(`DELETE /uploads/messenger/{id}`). `GET /me`의 `aiDataDeleteAt`이 지워질 시각이에요. 새 AI 기능(대화 시작 · 메신저 올리기)은 철회하는 순간부터 403이에요.
    - **시점은 두 가지:** 바로가기(1개월 · 6개월 · 1년 전)는 그 무렵 **전후 2주**(`scope: AROUND`, 기준일은 그 주 월요일), 캘린더에서 날짜를 직접 고르면 그날 **하루**(`scope: DAY`, 기준일은 그 날짜 그대로)의 기록으로 그때의 나를 만들어요. 스토리보드가 슬라이더 · 막대 그래프를 없애고 이렇게 바뀌어서 `/personas/timeline`은 지웠어요.
    - **하루 단위(`DAY`)에는 메신저 말투 분석만 더해요(2026.10.28 결정, 팀원 확인 필요):** 일기 한 편만으로는 말투 단서가 적어서, 그날의 일기에 그날이 속한 주의 메신저 요약 중 말투 분석(`traits`)만 더해요. 그 주의 일(`summary`)이나 대표 문장(`samples`)은 쓰지 않아서 그날 뒤의 일이 새지 않아요. 그래서 `DAY`의 `messengerWeeks`는 0 또는 1이에요. 기록 수준(`level`)은 `DAY`일 때 그날의 일기 건수만 봐요.
    - **홈에는 바로가기 카드가 없어요:** 홈은 감정 색 점이 찍힌 캘린더와 "오늘의 일기 쓰기"뿐이고, 시점 고르기는 "과거의 나" 탭에서 시작해요. 감정 색은 `GET /diaries`의 `emotions`로 그려요.
    - **커플 모드는 "같은 날 비교":** 스토리보드가 상대 페르소나와 대화하는 방식에서, 각자 자기 과거의 나와 대화한 뒤 두 사람의 기억을 나란히 보는 방식(`함께 볼 날 고르기` → `두 시점 비교`)으로 바뀐 것으로 읽었어요. 그래서 대화 상대는 항상 나(`persona_owner_id`는 `user_id`와 같아요)이고, 비교는 두 세션의 리포트를 짝지어서 해요.

    ## 팀원과 확인할 것

    1. **기록 수준(`RecordLevel`) 기준:** 앱은 enum만 보여주고 기준은 서버가 정해요. 스키마 설명의 기준은 임시 초안이고, 팀원과 상의해서 정할 예정이에요.
    2. **일기의 위기 신호 감지는 뺐어요:** 일기 저장은 3초 안에 끝나야 해서(기획서 4.2) AI 호출을 붙이지 않았어요. 대화 중 감지(`safety` 이벤트)만 있어요.
    3. **`couples.status` 값:** `PENDING`, `CONNECTED`, `DISCONNECTED` 세 가지를 쓴다고 가정했어요. `EXPIRED`는 `code_expires_at`로 계산해서 응답에만 나와요.
    4. **상담전화 번호:** `safety` 이벤트로 내려주는 번호(109 · 1577-0199)는 발표 전에 공식 안내로 확인해야 해요.
    5. **글자 읽기 · 가리기는 프론트엔드 일이에요:** 개발 빌드(네이티브 글자 인식)가 필요하고, iOS · 안드로이드 모두 한국어 카카오톡 캡처로 정확도를 먼저 시험해야 해요(가짜 캡처 30~50장, 정답 포함). 결과에 따라 가림 규칙을 정해요.
    6. **스토리보드의 "연결" 칸과 이름이 다른 곳:** `POST /users/consent`(명세는 `PUT /me/consent`), `diary_entries`(명세 · ERD는 `diaries`)예요. 스토리보드 쪽을 명세 이름으로 맞춰 주세요.
    7. **커플 모드 개념을 확인해 주세요:** 위 "같은 날 비교"로 읽은 게 맞는지, 그리고 커플 "동의 안내" 문구("상대방이 ... '과거의 회원님'과 대화하게 됩니다")가 새 흐름(상대가 내 과거와 대화하는 게 아니라 내 그날의 기억 요약을 보는 것)과 맞는지 확인이 필요해요. 이 문구는 앱 화면과 기획서 6.2에 같이 있어서 한꺼번에 고쳐야 해요.
    8. **이름 · 학교 후보 찾기(가정):** 업로드 때 "가릴 이름 목록"(내 이름, 연인 이름, 학교)을 한 번 입력받고, 대화창 위쪽에 보이는 이름은 자동 후보로 보여주는 방식으로 시작해요. 스토리보드에 입력 화면이 없어서 추가가 필요해요. 정확도가 부족하면 작은 한국어 이름 인식 모델을 검토해요.

servers:
  - url: http://localhost:8080
    description: 로컬 개발
  - url: https://{host}
    description: 배포 서버 (Render). 주소가 정해지기 전이라 임시 값이에요
    variables:
      host:
        default: dearus-server.onrender.com

tags:
  - name: auth
    description: 소셜 로그인
  - name: me
    description: 내 계정 · 사용 시간
  - name: diaries
    description: 일기 · 캘린더
  - name: uploads
    description: 메신저 대화 업로드 (사진은 보내지 않고, 폰이 가린 글자만 보내요)
  - name: personas
    description: 시점 선택 · 기록량
  - name: chats
    description: Time-Slip Chat · 회고 리포트
  - name: couples
    description: 커플 모드

security:
  - bearerAuth: []

paths:
  /auth/{provider}:
    post:
      tags: [auth]
      operationId: login
      summary: 소셜 로그인
      description: |
        소셜 SDK에서 받은 토큰을 서버가 제공자에게 검증하고 JWT를 발급해요. 처음이면 계정을 만들어요.

        | provider | `token`에 담을 값 |
        |---|---|
        | `kakao` | 카카오 SDK의 access token |
        | `google` | 구글 로그인의 ID token |
        | `apple` | 애플 로그인의 identity token |
        | `dev` | 개발용 가짜 로그인. 아무 문자열이나 넣어요. 같은 문자열이면 같은 사용자예요 |

        `dev`는 서버에 `DEV_LOGIN_ENABLED=true`일 때만 켜지고(로컬 개발용), 꺼져 있으면 404예요. 배포 서버에서는 꺼 둬요.
        `kakao` · `google` · `apple`은 제공자 토큰 검증을 붙이기 전까지 501(`AUTH_PROVIDER_NOT_READY`)을 돌려줘요.
      x-schedule: 10월 3~4주
      x-screen: 로그인
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [kakao, google, apple, dev]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthRequest'
      responses:
        '200':
          description: 로그인 성공. `user.needsConsent`가 `true`면 서비스 이용 동의 화면(`PUT /me/consent`)으로 보내요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: 제공자 토큰이 올바르지 않아요 (`AUTH_PROVIDER_TOKEN_INVALID`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: 없는 로그인 방식이거나, 꺼져 있는 `dev` 로그인이에요 (`NOT_FOUND`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '501':
          description: 아직 준비 중인 로그인 방식이에요 (`AUTH_PROVIDER_NOT_READY`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /me:
    get:
      tags: [me]
      operationId: getMe
      summary: 내 정보
      x-schedule: 10월 3~4주
      x-screen: 홈 인사말, 설정
      responses:
        '200':
          description: 내 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [me]
      operationId: deleteMe
      summary: 회원 탈퇴
      description: 계정과 모든 데이터를 바로 지워요 (ERD의 `ON DELETE CASCADE`). 되돌릴 수 없어요.
      x-schedule: 10월 3~4주
      x-screen: 설정
      responses:
        '204':
          description: 삭제 완료
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/consent:
    put:
      tags: [me]
      operationId: giveConsent
      summary: 서비스 이용 동의
      description: |
        로그인 직후 "서비스 이용 동의" 화면의 "동의하고 시작하기"예요. 로그인 응답의 `user.needsConsent`가 `true`인 사용자에게만 보여주고, 이미 동의한 계정은 이 화면을 건너뛰어요.

        - 필수 3개(`terms` 이용약관, `privacy` 개인정보 수집 · 이용, `aiAnalysis` 일기 · 대화 내용 AI 분석)가 모두 `true`여야 해요. 하나라도 아니면 400(`VALIDATION_FAILED`, `details.fields`)이에요.
        - `notifications`(일기 작성 알림 받기, 선택)는 안 보내면 지금 설정을 그대로 둬요.
        - 동의 시각은 한 번만 기록해요(`users.ai_consent_at`). 이미 유효한 동의에 다시 불러도 시각은 그대로고 알림 설정만 바뀌어요. 철회한 뒤 다시 동의하면 시각을 새로 기록하고 철회를 지워요.
      x-schedule: 10월 3~4주
      x-screen: 약관 · 동의
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserConsentRequest'
      responses:
        '200':
          description: 갱신된 내 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [me]
      operationId: revokeAiConsent
      summary: AI 분석 동의 철회
      description: |
        설정의 "동의 철회"예요. AI 분석 동의만 철회하고, 이후 AI를 부르는 API(메신저 업로드 · 대화 · 리포트)는 403 `AI_CONSENT_REQUIRED`를 돌려줘요. 일기 쓰기와 조회는 계속 쓸 수 있어요.
        저장된 분석 데이터(메신저 요약 · 시점 분석)와 대화 기록은 바로 지우지 않고 철회한 날부터 30일 동안 보관한 뒤 서버가 지워요(일기는 지우지 않아요). 그 안에 `PUT /me/consent`로 다시 동의하면 이어서 쓸 수 있어요. 응답의 `aiDataDeleteAt`이 지워질 시각이에요. 이미 철회했거나 동의한 적이 없으면 아무것도 바꾸지 않고 현재 상태를 돌려줘요.
        다시 쓰려면 `PUT /me/consent`로 동의해요.
      x-schedule: 10월 3~4주
      x-screen: 설정
      responses:
        '200':
          description: '갱신된 내 정보 (`aiConsentActive: false`)'
          content:
