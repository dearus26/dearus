  /uploads/messenger:
    post:
      tags: [uploads]
      operationId: uploadMessenger
      summary: 메신저 대화 올리기 (가린 글자)
      description: |
        메신저(카톡 · 디스코드 등) 대화 캡처를 올릴 때 **사진은 보내지 않아요.** 앱이 폰 안에서 사진 속 글자를 읽고, 민감정보를 가리고, 내 말풍선만 골라서, 가린 글자만 이 API로 보내요(상대 메시지는 폰에서 버려요).
        이 서버에는 사진을 받는 API가 없어요. 이미지나 `multipart/form-data`를 보내면 415예요.

        서버는 받은 글자를 한 번 더 규칙으로 가린 뒤(앱이 놓친 전화번호 · 계좌번호 · 이메일 등), 주 단위로 묶어 AI로 요약하고 암호화해 저장해요. 시간이 걸릴 수 있어서 **202**로 바로 응답하고, 결과는 `GET /uploads/messenger/{uploadId}`를 1~2초 간격으로 조회해서 `status`가 `DONE` 또는 `FAILED`가 될 때까지 기다려요.

        `messages[].date`는 앱이 대화 화면의 날짜 구분선에서 읽어요. 날짜를 알 수 없는 글자는 앱이 사용자에게 물어서 채운 뒤 보내요.
        서버는 받은 글자를 요약이 끝날 때까지만 메모리에 두고 저장하지 않아요(성공하든 실패하든 요약만 남겨요). 서버가 다시 시작되거나 10분이 지나도 끝나지 않으면 `FAILED`(`PROCESSING_TIMEOUT`)가 되니, 앱은 `DONE`을 받을 때까지 가린 글자를 폰에 갖고 있다가 필요하면 다시 보내요.
        앞서 올린 글이 아직 `PROCESSING`이면 409 `UPLOAD_IN_PROGRESS`예요(같은 사람의 AI 호출이 겹치지 않게 막아요). 한 주라도 요약에 실패하면 그 업로드는 통째로 `FAILED`이고 요약은 하나도 저장하지 않아요.
        한도(초안): 메시지 5,000개, 한 메시지 2,000자, 요청 전체 1MB, 한 번에 60주(약 1년)까지. 주는 월요일에 시작해요.
        걸리는 시간: 한 주 요약은 최대 15초로 보고, 서버가 최대 4주씩 동시에 처리해요(8주면 30초 안쪽, 60주면 4분 안쪽). 앱의 "분석 중" 화면은 이 정도를 기다릴 수 있어야 해요.
      x-schedule: 10월 4주~11월 1주
      x-screen: 메신저 올리기, 분석 완료
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MessengerUploadRequest'
      responses:
        '202':
          description: 접수됨. 요약은 서버에서 진행 중이에요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessengerUpload'
        '400':
          description: 동의하지 않았거나(`CONSENT_REQUIRED`) 요청 값이 올바르지 않아요(`VALIDATION_FAILED`, 미래 날짜 · 60주 초과 포함)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AiConsentRequired'
        '409':
          description: 앞서 올린 대화를 아직 분석하고 있어요 (`UPLOAD_IN_PROGRESS`). `DONE`이나 `FAILED`가 된 뒤에 다시 올려요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '413':
          description: 요청이 너무 커요 (`PAYLOAD_TOO_LARGE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '415':
          description: 사진은 받지 않아요 (`IMAGES_NOT_ACCEPTED`). 앱이 폰 안에서 글자를 읽어 JSON으로 보내야 해요
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    get:
      tags: [uploads]
      operationId: listMessengerUploads
      summary: 올린 메신저 대화 목록
      description: 설정의 "내 데이터 보기 · 삭제"에서 써요. 최신순이에요.
      x-schedule: 11월 1주
      x-screen: 설정
      responses:
        '200':
          description: 업로드 목록
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MessengerUpload'
        '401':
          $ref: '#/components/responses/Unauthorized'

