  /personas/shortcuts:
    get:
      tags: [personas]
      operationId: getShortcuts
      summary: 바로가기 3개
      description: |
        "시점 고르기" 화면의 1개월 · 6개월 · 1년 전 바로가기예요. 바로가기는 그 무렵 **전후 2주**(`scope: AROUND`)의 기록으로 그때의 나를 만들어요.
        기준일(`anchorDate`)은 서버가 **그 주 월요일**로 맞춰서 내려줘요(같은 주에는 같은 분석을 재사용하기 위해서예요).
        1년 전 바로가기의 월요일이 오늘로부터 365일보다 이전이면 다음 월요일로 잡아요(날짜 범위 안에 들어오게요).
        앱은 바로가기를 누르면 받은 `anchorDate`와 `scope`, `key`를 그대로 `POST /chats`에 넘겨요.
      x-schedule: 11월 1~2주
      x-screen: 시점 고르기
      responses:
        '200':
          description: 바로가기 3개 (1개월 → 1년 순서)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShortcutList'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /personas/preview:
    get:
      tags: [personas]
      operationId: previewPersona
      summary: 고른 날짜의 기록량
      description: |
        캘린더에서 날짜를 직접 고르면 그날 **하루**(`scope: DAY`)의 기록으로 그날의 나를 만들어요. 그 하루의 일기 건수와 감정 태그, 기록 수준을 알려줘요("10월 4일의 나 · 화남 · 일기 1건").
        `scope=AROUND`로 부르면 그 날짜 전후 2주 범위를 보여줘요(바로가기와 같은 구간).
        직접 고른 날짜는 그대로 `anchorDate`가 돼요(주 단위로 맞추지 않아요). AI를 호출하지 않는 가벼운 조회예요.
      x-schedule: 11월 1~2주
      x-screen: 시점 고르기
      parameters:
        - name: anchor
          in: query
          required: true
          description: 오늘로부터 365일 전 ~ 오늘
          schema:
            type: string
            format: date
          example: '2026-10-04'
        - name: scope
          in: query
          description: '`DAY`는 그날 하루, `AROUND`는 전후 2주'
          schema:
            type: string
            enum: [DAY, AROUND]
            default: DAY
      responses:
        '200':
          description: 기록량
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaWindow'
        '400':
          description: 고를 수 없는 날짜예요 (`ANCHOR_OUT_OF_RANGE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /chats:
    get:
      tags: [chats]
      operationId: listChats
      summary: 과거의 나 목록
      description: |
        하단 탭 "과거의 나"의 대화 목록이에요. 최근에 대화한 순서(`lastMessageAt` 내림차순)로 최대 50개를 돌려줘요.
        항목을 누르면 `GET /chats/{chatId}`와 `GET /chats/{chatId}/messages`로 지난 대화를 보고, 끝나지 않은 세션이면 이어서 대화해요.
        목록이 비어 있으면(첫 방문) 앱은 이 화면을 건너뛰고 바로 시점 고르기로 가요.
        커플 모드에서 만든 세션(`mode: COUPLE`)은 이 목록에 넣지 않는 것으로 가정했어요.
      x-schedule: 11월 1~3주
      x-screen: 과거의 나 목록
      responses:
        '200':
          description: 대화 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatList'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [chats]
      operationId: createChat
      summary: 과거의 나와 대화 시작
      description: |
        선택한 시점의 대화 세션을 만들어요.

        1. 같은 시점의 저장된 분석이 있고 그 무렵 기록이 바뀌지 않았으면 바로 `READY`예요.
        2. 아니면 `PREPARING`으로 돌려주고, 서버가 기록 모으기 → 민감정보 가리기 → 말투 분석 → 페르소나 만들기를 진행해요. 앱은 `GET /chats/{chatId}`를 1~2초 간격으로 조회해요 (`preparingStep`으로 로딩 화면의 단계를 표시해요).
        3. `READY`가 되면 페르소나의 첫 인사가 `seq` 1번 메시지로 들어 있어요. `GET /chats/{chatId}/messages`로 가져와요.

        기록이 전혀 없으면(`NONE`) AI를 부르지 않고 바로 `READY`예요(기본 말투로 대화하고 앱이 정확도 안내를 보여줘요). 분석에 실패하면 `FAILED`이고 이전에 저장한 분석은 그대로 남아요.

        `scope`는 시점 고르기에서 정해져요. 바로가기는 `AROUND`(전후 2주, `shortcutKey`도 함께 보내요), 캘린더에서 고른 날은 `DAY`(그날 하루)예요.
        `forCouple: true`는 커플 모드의 "같은 날 비교"를 위한 세션이에요. 대화 상대는 여전히 내 과거의 나이고, 커플이 `CONNECTED`이고 양측이 동의했고 철회가 없을 때만 만들 수 있어요.
        커플 기능을 만들기 전(11월 3주 전)에는 `forCouple: true`가 항상 403 `COUPLE_ACCESS_DENIED`예요. `shortcutKey`는 `scope`가 `AROUND`일 때만 보낼 수 있어요(아니면 400).
        `PREPARING`이 10분이 지나도 끝나지 않으면 조회할 때 `FAILED`(`PREPARING_TIMEOUT`)가 돼요(서버가 다시 켜진 경우 포함). 분석은 전후 2주가 약 14초, 하루가 약 9초 걸리는 것으로 봐요.
      x-schedule: 11월 1~3주
      x-screen: 불러오는 중, Time-Slip Chat, 함께 볼 날 고르기
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCreate'
      responses:
        '201':
          description: 세션 생성됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSession'
        '400':
          description: 고를 수 없는 날짜예요 (`ANCHOR_OUT_OF_RANGE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: 커플 비교를 열 수 없어요(`COUPLE_ACCESS_DENIED`, `forCouple`일 때) 또는 AI 분석 동의가 없어요(`AI_CONSENT_REQUIRED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /chats/{chatId}:
    parameters:
      - $ref: '#/components/parameters/ChatId'
    get:
      tags: [chats]
      operationId: getChat
      summary: 대화 세션 상태
      description: 준비 중인지, 정확도가 어떤지, 끝났는지를 알려줘요. 대화 화면 상단 "3개월 전의 나 · 2026년 7월 무렵 · 정확도 보통"도 여기서 만들어요.
      x-schedule: 11월 1~3주
      x-screen: 불러오는 중, Time-Slip Chat
      responses:
        '200':
          description: 세션
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSession'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /chats/{chatId}/messages:
    parameters:
      - $ref: '#/components/parameters/ChatId'
    get:
      tags: [chats]
      operationId: listChatMessages
      summary: 대화 내용
      description: '`seq` 오름차순이에요. `afterSeq`보다 큰 메시지만 돌려줘서, 처음에는 생략하고 이어서 받을 때 마지막 `seq`를 넘겨요.'
      x-schedule: 11월 1~3주
      x-screen: Time-Slip Chat
      parameters:
        - name: afterSeq
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        '200':
          description: 메시지 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags: [chats]
      operationId: sendChatMessage
      summary: 말 걸기 (답변 스트리밍)
      description: |
        내 말을 보내면 과거의 내가 답해요. 첫 응답은 5초 안, 20턴 이상 이어지는 게 목표예요.

        **응답 방식은 `Accept` 헤더로 골라요.**

        - `Accept: text/event-stream` (기본): 답변을 SSE로 조금씩 받아요. React Native에서는 `expo/fetch`의 스트림을 써요.
        - `Accept: application/json`: 답변이 다 만들어진 뒤 한 번에 받아요. 스트림이 안 될 때의 대비책이에요.

        **SSE 이벤트**는 아래 순서로 와요. 각 이벤트의 `data`는 JSON 한 줄이에요.

        | event | 언제 | data |
        |---|---|---|
        | `token` | 답변이 만들어지는 동안 여러 번 | `{ "text": "어, " }` |
        | `safety` | 위기 신호를 감지했을 때 (0~1번, `done` 앞) | `SafetyNotice` |
        | `done` | 답변이 끝나고 저장됐을 때 | `ChatReply` |
        | `error` | 도중에 실패했을 때 (이후 이벤트 없음) | `Error` |

        세션이 `READY`가 아니면 409 `CHAT_NOT_READY`, 이미 끝났으면 409 `CHAT_ENDED`예요.
      x-schedule: 11월 1~3주
      x-screen: Time-Slip Chat, 안전 안내
      x-sse-events:
        token: { data: { text: string } }
        safety: { data: SafetyNotice }
        done: { data: ChatReply }
        error: { data: Error }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessage'
      responses:
        '200':
          description: 답변
          content:
            text/event-stream:
              schema:
                type: string
              example: |
                event: token
                data: {"text":"어, "}

                event: token
                data: {"text":"왔어? 요즘 학기 끝나가서 정신이 없어 ㅋㅋ"}

                event: done
                data: {"userMessage":{"id":3,"seq":2,"role":"USER","content":"응, 3개월 뒤의 너야.","createdAt":"2026-10-06T21:31:02+09:00"},"personaMessage":{"id":4,"seq":3,"role":"PERSONA","content":"어, 왔어? 요즘 학기 끝나가서 정신이 없어 ㅋㅋ","createdAt":"2026-10-06T21:31:05+09:00"}}
            application/json:
              schema:
                $ref: '#/components/schemas/ChatReply'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/AiConsentRequired'
        '409':
          description: 대화할 수 없는 상태예요 (`CHAT_NOT_READY`, `CHAT_ENDED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/AiUnavailable'

  /chats/{chatId}/end:
    parameters:
      - $ref: '#/components/parameters/ChatId'
    post:
      tags: [chats]
      operationId: endChat
      summary: 대화 끝내기
      description: |
        세션을 끝내고 회고 리포트 만들기를 시작해요. 이미 끝난 세션에 다시 불러도 같은 결과를 돌려줘요.
        리포트는 `GET /chats/{chatId}/report`로 받아요.
      x-schedule: 11월 2~3주
      x-screen: Time-Slip Chat(종료), 회고 리포트
      responses:
        '200':
          description: 종료됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndChatResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 아직 준비 중인 세션이에요 (`CHAT_NOT_READY`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /chats/{chatId}/report:
    parameters:
      - $ref: '#/components/parameters/ChatId'
    get:
      tags: [chats]
      operationId: getReport
      summary: 회고 리포트
      description: |
        개인 모드는 당시 고민 · 현재 변화 · 한 줄 요약 3개 항목이에요 (세션당 1건). 아직 만드는 중이면 202를 돌려주니 1~2초 뒤에 다시 불러요.
        커플 모드(`forCouple`) 세션의 리포트는 3개 항목 대신 "그날의 기억"(`memorySummary`)과 한 줄 요약이에요. 두 사람의 기억을 나란히 보는 화면은 `GET /couples/comparisons`가 따로 만들어 줘요.
      x-schedule: 11월 2~3주
      x-screen: 회고 리포트, 두 시점 비교
      responses:
        '200':
          description: 리포트
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Report'
        '202':
          description: 만드는 중
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportPending'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 세션이 없거나 아직 끝내지 않았어요 (`NOT_FOUND`, `CHAT_NOT_ENDED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /couples/me:
    get:
      tags: [couples]
      operationId: getCouple
      summary: 내 커플 상태
      description: |
        초대 코드 화면(상대가 입력하길 기다리는 중), 동의 화면(양쪽 동의 상태), 설정(연결됨 표시)이 모두 이 응답으로 그려져요.
        기다리는 화면에서는 3~5초 간격으로 조회해요. 연결이 없으면 `status: NONE`이고 "아직 만든 코드가 없어요" 상태를 보여줘요.
      x-schedule: 11월 3주
      x-screen: 초대 코드 연결, 동의 안내, 설정
      responses:
        '200':
          description: '커플 상태 (연결이 없으면 `status: NONE`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoupleState'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /couples/invite:
    post:
      tags: [couples]
      operationId: createInvite
      summary: 초대 코드 만들기
      description: |
        "초대 코드 만들기" 버튼을 누른 시점에 코드를 발급해요(화면에 들어올 때는 만들지 않아요). 코드는 24시간 동안 유효해요.
        이미 만든 코드가 아직 유효하면 같은 코드를 돌려줘요. 만료됐으면 새로 만들어요. 이미 연결된 커플이 있으면 409예요.
      x-schedule: 11월 3주
      x-screen: 초대 코드 연결
      responses:
        '200':
          description: '초대 코드가 담긴 커플 상태 (`status: PENDING`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoupleState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 이미 연결된 커플이 있어요 (`ALREADY_IN_COUPLE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /couples/invite/accept:
    post:
      tags: [couples]
      operationId: acceptInvite
      summary: 받은 코드 입력하기
      description: |
        받은 초대 코드를 입력해 연결해요. iOS와 Android 어느 쪽에서도 같은 방식이에요. 연결만 되고, 둘 다 동의해야 같은 날 비교를 열 수 있어요.
      x-schedule: 11월 3주
      x-screen: 초대 코드 연결 ("코드 입력하기" 탭)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInviteRequest'
      responses:
        '200':
          description: '연결됨 (`status: CONNECTED`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoupleState'
        '400':
          description: 내가 만든 코드는 입력할 수 없어요 (`COUPLE_OWN_CODE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 없는 코드예요 (`COUPLE_CODE_INVALID`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: 이미 연결된 커플이 있어요 (`ALREADY_IN_COUPLE`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '410':
          description: 만료된 코드예요 (`COUPLE_CODE_EXPIRED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /couples/consent:
    post:
      tags: [couples]
      operationId: giveCouplesConsent
      summary: 커플 모드 동의
      description: |
        내 동의를 기록해요(`couple_members.consented_at`). 두 사람이 모두 동의하면 응답의 `compareOpen`이 `true`가 돼요.
        이미 동의했으면 같은 결과를 돌려줘요.
      x-schedule: 11월 3주
      x-screen: 동의 안내
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRequest'
      responses:
        '200':
          description: 갱신된 커플 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoupleState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: 연결된 커플이 없어요 (`COUPLE_NOT_CONNECTED`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /couples/days:
    get:
      tags: [couples]
      operationId: listCoupleDays
      summary: 함께 볼 수 있는 날
      description: |
        "함께 볼 날 고르기" 화면이에요. 두 사람의 일기가 모두 있는 날만 돌려줘요. 그중 감정 태그가 대비되는 날(특히 다툰 날)을 서버가 먼저 추천해요(`recommended: true`).
        한 달치를 받아 캘린더에 표시하고, 추천한 날은 맨 위 카드로 보여줘요. 연결됨 + 양측 동의 + 철회 없음일 때만 열려요(아니면 403 `COUPLE_ACCESS_DENIED`).
        1개월 · 6개월 · 1년 전으로 비교하는 경우는 `GET /personas/shortcuts`의 바로가기를 같이 써요.
        초안이에요. 커플 단계에서 스토리보드와 다시 맞춰요.
      x-schedule: 11월 3주
      x-screen: 함께 볼 날 고르기
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to
          in: query
          required: true
          description: 이 날짜를 포함해요. 최대 93일이에요
          schema:
            type: string
            format: date
      responses:
        '200':
          description: 두 사람의 일기가 모두 있는 날 (날짜 오름차순)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoupleDayList'
        '400':
          $ref: '#/components/responses/ValidationFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CoupleAccessDenied'

  /couples/comparisons:
    get:
      tags: [couples]
      operationId: getCoupleComparison
      summary: 같은 날 두 사람의 기억 비교
      description: |
        "두 시점 비교" 화면이에요. 같은 날(`anchorDate` · `scope`)에 대해 각자 자기 과거의 나와 나눈 대화(`POST /chats`의 `forCouple: true` 세션)를 같은 틀("그날의 기억")로 요약해 나란히 보여주고, 두 사람의 간극을 한 줄로 합쳐 줘요.
        두 사람 모두 대화를 끝내야 `READY`가 돼요. 한쪽만 끝냈으면 `WAITING_PARTNER`이고 상대의 기억은 아직 비어 있어요.
        연결됨 + 양측 동의 + 철회 없음일 때만 열려요. 철회하면 이 비교와 두 세션 · 리포트를 모두 지워요.
        초안이에요. 커플 단계에서 스토리보드와 다시 맞춰요.
      x-schedule: 11월 3주
      x-screen: 두 시점 비교
      parameters:
        - name: anchorDate
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: scope
          in: query
          schema:
            type: string
            enum: [DAY, AROUND]
            default: DAY
      responses:
        '200':
          description: 비교 상태와 내용
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoupleComparison'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/CoupleAccessDenied'

  /couples/revoke:
    post:
      tags: [couples]
      operationId: revokeCouple
      summary: 동의 철회 · 연결 해제
      description: |
        상대의 접근을 바로 끊고, 이 커플의 대화와 리포트(기억 요약 · 간극)를 지워요. 내 일기와 개인 모드 기록, 내 분석 결과는 그대로 남아요.
        되돌릴 수 없어요.
      x-schedule: 11월 3주
      x-screen: 동의 철회
      responses:
        '200':
          description: '해제됨 (`status: NONE`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoupleState'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ChatId:
      name: chatId
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    Unauthorized:
      description: 로그인이 필요하거나 토큰이 만료됐어요 (`UNAUTHORIZED`). 다시 로그인해요
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: UNAUTHORIZED
            message: 로그인이 만료됐어요. 다시 로그인해 주세요.
    ValidationFailed:
      description: 요청 값이 올바르지 않아요 (`VALIDATION_FAILED`). `details.fields`에 항목별 이유가 있어요
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: VALIDATION_FAILED
            message: 입력한 내용을 다시 확인해 주세요.
            details:
              fields:
                - field: content
                  reason: 비어 있을 수 없어요
    NotFound:
      description: 찾을 수 없어요 (`NOT_FOUND`). 남의 데이터도 같은 응답이에요
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: NOT_FOUND
            message: 찾을 수 없어요.
    CoupleAccessDenied:
      description: 상대의 기록을 볼 수 없어요 (`COUPLE_ACCESS_DENIED`). 연결 · 양측 동의 · 철회 없음 조건을 모두 만족하지 않았어요
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: COUPLE_ACCESS_DENIED
            message: 두 사람이 모두 동의해야 만날 수 있어요.
    AiUnavailable:
      description: AI가 지금 응답하지 못해요 (`AI_UNAVAILABLE`). 잠시 뒤 다시 시도해요
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: AI_UNAVAILABLE
            message: 지금은 답하기 어려워요. 잠시 뒤에 다시 해 주세요.

    AiConsentRequired:
      description: AI 분석 동의가 없거나 철회했어요 (`AI_CONSENT_REQUIRED`). `PUT /me/consent`로 다시 동의해야 해요
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            code: AI_CONSENT_REQUIRED
            message: AI 분석 동의가 필요해요.

  schemas:
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: |
            앱이 분기에 쓰는 값이에요. 공통: `UNAUTHORIZED`, `VALIDATION_FAILED`, `NOT_FOUND`, `AI_UNAVAILABLE`.
            그 밖의 값은 각 API 응답 설명에 적었어요.
          example: DIARY_ALREADY_EXISTS
        message:
          type: string
          description: 화면에 그대로 보여줘도 되는 해요체 문장
          example: 이 날짜에 쓴 일기가 이미 있어요.
        details:
          type: object
          nullable: true
          additionalProperties: true
          description: 코드마다 달라요 (예 `diaryId`, `speakers`, `fields`)

    # ───────── 로그인 · 계정 ─────────
    AuthRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          description: 소셜 SDK가 준 토큰 (provider마다 종류가 달라요)
        nickname:
          type: string
          maxLength: 20
          description: 애플은 처음 한 번만 이름을 주기 때문에, 있으면 함께 보내요. 없으면 서버가 제공자 프로필의 이름을 써요
    AuthResponse:
      type: object
      required: [accessToken, tokenType, expiresAt, isNewUser, user]
      properties:
        accessToken:
          type: string
        tokenType:
          type: string
          enum: [Bearer]
        expiresAt:
          type: string
          format: date-time
          description: 초안은 발급 후 14일이에요. 만료되면 다시 로그인해요
        isNewUser:
          type: boolean
          description: 이번에 계정이 만들어졌으면 `true`
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      required: [id, provider, nickname, aiConsentActive, needsConsent, notificationsOptIn, createdAt]
      properties:
        id:
          type: string
          format: uuid
        provider:
          type: string
          enum: [kakao, google, apple, dev]
        nickname:
          type: string
          example: 서연
        aiConsentedAt:
          type: string
          format: date-time
          nullable: true
          description: 서비스 이용 동의(필수 3개)를 받은 시각. 아직 동의하지 않았으면 `null`. 철회 뒤 다시 동의하면 새로 기록해요
        aiRevokedAt:
          type: string
          format: date-time
          nullable: true
          description: AI 분석 동의를 철회한 시각. 철회하지 않았거나 다시 동의했으면 `null`
        aiDataDeleteAt:
          type: string
          format: date-time
          nullable: true
          description: 철회한 상태일 때, 보관 중인 분석 데이터와 대화 기록이 지워지는 시각(철회 시각 + 30일). 설정 화면에 "○월 ○일에 모두 지워져요"로 보여줘요. 다시 동의하면 `null`이 돼요
        aiConsentActive:
          type: boolean
          description: AI 분석 동의가 유효한지. 카톡 업로드 · 대화 · 리포트처럼 AI를 부르는 기능은 `true`일 때만 쓸 수 있어요 (아니면 403 `AI_CONSENT_REQUIRED`)
        needsConsent:
          type: boolean
          description: 서비스 이용 동의 화면을 아직 거치지 않았어요. `true`면 로그인 직후 동의 화면을 보여줘요. 한 번 동의했다가 철회한 사람은 `false`예요
        notificationsOptIn:
          type: boolean
          description: 일기 작성 알림을 받겠다고 했는지 (동의 화면의 선택 항목)
        createdAt:
          type: string
          format: date-time
    UserConsentRequest:
      type: object
      required: [terms, privacy, aiAnalysis]
      properties:
        terms:
          type: boolean
          enum: [true]
          description: 이용약관 (필수)
        privacy:
          type: boolean
          enum: [true]
          description: 개인정보 수집 · 이용 (필수)
        aiAnalysis:
          type: boolean
          enum: [true]
          description: 일기 · 대화 내용 AI 분석 (필수). 가린 내용(글자)만 AI로 보내고 학습에는 쓰이지 않아요
        notifications:
          type: boolean
          description: 일기 작성 알림 받기 (선택). 안 보내면 지금 설정 그대로예요
    Usage:
      type: object
      required: [date, chatMinutes, recommendedMinutes]
      properties:
        date:
          type: string
          format: date
        chatMinutes:
          type: integer
          minimum: 0
          example: 12
        recommendedMinutes:
          type: integer
          example: 30

    # ───────── 일기 ─────────
    Emotion:
      type: string
      description: |
        감정 태그. 스토리보드의 7개예요.
        기쁨 `JOY`, 설렘 `EXCITED`, 평온 `CALM`, 피곤 `TIRED`, 슬픔 `SAD`, 불안 `ANXIOUS`, 화남 `ANGRY`
      enum: [JOY, EXCITED, CALM, TIRED, SAD, ANXIOUS, ANGRY]
    Diary:
      type: object
      required: [id, date, content, emotions, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        content:
          type: string
        emotions:
          type: array
          items:
            $ref: '#/components/schemas/Emotion'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      example:
        id: 7d6f2c1e-3b0a-4c55-9a1e-2f4b8c9d0e11
        date: '2026-10-05'
        content: 오늘은 팀원들이랑 발표 준비를 했다. 그래도 하루 종일 앉아 있었더니 많이 피곤하다.
        emotions: [CALM, TIRED]
        createdAt: '2026-10-05T22:10:00+09:00'
        updatedAt: '2026-10-05T22:10:00+09:00'
    DiaryCreate:
      type: object
      required: [date, content]
      properties:
        date:
          type: string
          format: date
          description: 오늘 또는 지난 날짜. 미래는 `VALIDATION_FAILED`
        content:
          type: string
          minLength: 1
          maxLength: 5000
        emotions:
          type: array
          maxItems: 7
          uniqueItems: true
          default: []
          description: 여러 개를 고를 수 있어요. 하나도 안 골라도 저장돼요 (스토리보드에 필수 표시가 없어서 가정했어요)
          items:
            $ref: '#/components/schemas/Emotion'
    DiaryUpdate:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 5000
        emotions:
          type: array
          maxItems: 7
          uniqueItems: true
          default: []
          items:
            $ref: '#/components/schemas/Emotion'
    DiaryList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Diary'

    # ───────── 카톡 업로드 ─────────
    MessengerSource:
      type: string
      enum: [KAKAOTALK, DISCORD, OTHER]
      description: |
        어느 메신저의 캡처인지. 앱이 내 말풍선을 구분하는 방법이 앱마다 달라요.
        첫 지원은 `KAKAOTALK`(오른쪽 · 노란색 말풍선이 나)이고, `DISCORD`처럼 말풍선이 없는 앱은 내 이름이 필요해서 뒤로 미뤄요.
    MessengerMessage:
      type: object
      required: [date, text]
      properties:
        date:
          type: string
          format: date
          description: 이 글자가 쓰인 날짜 (대화 화면의 날짜 구분선에서 앱이 읽어요)
        text:
          type: string
          minLength: 1
          maxLength: 2000
          description: 내 말풍선의 글자. 민감정보는 `[전화번호]`, `[이름]` 같은 표시로 이미 바뀌어 있어야 해요
    MessengerUploadRequest:
      type: object
      required: [source, consent, photoCount, maskedCount, userMaskedCount, messages]
      properties:
        source:
          $ref: '#/components/schemas/MessengerSource'
        consent:
          type: boolean
          enum: [true]
          description: '"위 내용을 이해했고 대화 분석에 동의해요" 체크. 올릴 때마다 한 번 더 확인해요. `true`가 아니면 400 `CONSENT_REQUIRED`예요'
        photoCount:
          type: integer
          minimum: 1
          maximum: 100
          description: 폰이 읽은 대화 캡처 수 ("읽은 대화 캡처 12장"). 사진 자체는 보내지 않아요
          example: 12
        maskedCount:
          type: integer
          minimum: 0
          description: 폰이 가린 민감정보 건수 ("가려진 민감정보 56건"). 직접 가린 건수를 포함해요
          example: 56
        userMaskedCount:
          type: integer
          minimum: 0
          description: 그중 사용자가 직접 가린 건수 ("직접 6건"). `maskedCount`보다 클 수 없어요
          example: 6
        messages:
          type: array
          minItems: 1
          maxItems: 5000
          items:
            $ref: '#/components/schemas/MessengerMessage'
      example:
        source: KAKAOTALK
        consent: true
        photoCount: 12
        maskedCount: 56
        userMaskedCount: 6
        messages:
          - date: '2026-09-28'
            text: 내 번호 [전화번호]이야
          - date: '2026-09-28'
            text: 오늘 [이름]이랑 점심 먹었어
    MessengerUpload:
      type: object
      required: [id, status, uploadedAt, photoCount, maskedCount, userMaskedCount, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [PROCESSING, DONE, FAILED]
        uploadedAt:
          type: string
          format: date-time
        photoCount:
          type: integer
        maskedCount:
          type: integer
        userMaskedCount:
          type: integer
        serverMaskedCount:
          type: integer
          nullable: true
          description: 서버가 한 번 더 가린 건수. 앱의 가림이 놓친 정도를 보는 값이고, 분석이 끝나야 채워져요
        periodStart:
          type: string
          format: date
          nullable: true
          description: 대화에서 찾은 첫 날짜. `DONE`일 때만 있어요
        periodEnd:
          type: string
          format: date
          nullable: true
        weekCount:
          type: integer
          nullable: true
          description: 저장한 주간 요약 수. `DONE`일 때만 있어요
          example: 8
        expiresAt:
          type: string
          format: date-time
          description: 업로드 1년 뒤에 요약이 자동으로 지워져요
        failureCode:
          type: string
          nullable: true
          description: |
            `FAILED`일 때의 이유예요. `AI_UNAVAILABLE`(AI에 닿지 못했어요) · `AI_REFUSED`(AI의 안전 장치가 거절했어요) ·
            `AI_BAD_RESPONSE`(AI의 답을 읽지 못했어요) · `PROCESSING_TIMEOUT`(10분이 지나도 안 끝났어요) · `INTERNAL_ERROR`.
            어느 경우든 앱은 가린 글자를 폰에 갖고 있다가 다시 보내요.
      example:
        id: 0c1d2e3f-4a5b-4c6d-8e7f-9a0b1c2d3e4f
        status: DONE
        uploadedAt: '2026-10-06T20:05:00+09:00'
        photoCount: 12
        maskedCount: 56
        userMaskedCount: 6
        serverMaskedCount: 0
        periodStart: '2026-08-04'
        periodEnd: '2026-09-28'
        weekCount: 8
        expiresAt: '2027-10-06T20:05:00+09:00'
        failureCode: null

    # ───────── 시점 · 기록량 ─────────
    RecordLevel:
      type: string
      enum: [NONE, LOW, ENOUGH, RICH]
      description: |
        선택한 구간에 기록이 얼마나 있는지예요. 앱은 enum만 보고 문구를 골라요. 기준은 서버가 정해요. 아래 표는 임시 초안이고, 팀원과 상의해서 확정할 예정이에요.

        | 값 | 초안 기준 (`AROUND`, 전후 2주) | 초안 기준 (`DAY`, 그날 하루) | 시점 고르기 문구 | 대화 상단 정확도 |
        |---|---|---|---|---|
        | `NONE` | 일기 0건, 메신저 0주 | 일기 0건 | 기록이 없어요 | 낮음 |
        | `LOW` | 일기 1~4건이고 메신저 0주 | (쓰지 않음) | 부족해요 | 낮음 |
        | `ENOUGH` | 일기 5~9건 또는 메신저 1주 이상 | 일기 1건 | 충분해요 (`DAY`는 "전후 기록이 적어 정확도는 보통일 수 있어요") | 보통 |
        | `RICH` | 일기 10건 이상 | (쓰지 않음) | 풍부해요 | 높음 |

        `DAY`는 그날의 일기 건수만 보고(`DAY`에 더하는 메신저 말투 분석은 기준에 넣지 않아요), 같은 주의 메신저 요약은 여러 번 올려도 한 주로 세요.
        `NONE`이나 `LOW`여도 대화는 할 수 있고, 앱이 "기록이 부족해 정확도가 낮을 수 있어요"를 보여줘요.
    PersonaScope:
      type: string
      enum: [DAY, AROUND]
      description: |
        그때의 나를 만드는 데 쓰는 기록의 범위예요.
        `AROUND`는 기준일 전후 2주(바로가기 1개월 · 6개월 · 1년 전), `DAY`는 기준일 그날 하루(캘린더에서 직접 고른 날)예요. ERD의 `persona_analyses.window_days`는 `AROUND`가 14, `DAY`가 0이에요.
    ShortcutKey:
      type: string
      enum: [ONE_MONTH, SIX_MONTHS, ONE_YEAR]
      description: 바로가기 종류. "과거의 나" 목록의 "1개월", "1년" 같은 칩에 써요
    PersonaWindow:
      type: object
      required: [anchorDate, scope, windowStart, windowEnd, diaryCount, messengerWeeks, level]
      properties:
        anchorDate:
          type: string
          format: date
          description: 기준일. 바로가기는 그 주 월요일, 직접 고른 날짜는 그대로
        scope:
          $ref: '#/components/schemas/PersonaScope'
        windowStart:
          type: string
          format: date
          description: '`AROUND`는 기준일 14일 전, `DAY`는 기준일 그대로'
        windowEnd:
          type: string
          format: date
          description: '`AROUND`는 기준일 14일 뒤(오늘을 넘으면 오늘로 줄여요), `DAY`는 기준일 그대로'
        diaryCount:
          type: integer
          example: 1
        messengerWeeks:
          type: integer
          description: 이 범위와 겹치는 주의 메신저 요약 수. `DAY`는 그날이 속한 주의 요약이 있으면 1, 없으면 0이에요(말투 분석만 써요). 같은 주를 여러 번 올렸으면 가장 최근 요약 하나만 세요
          example: 0
        emotions:
          type: array
          description: 그날의 감정 태그. `DAY`일 때만 채워지고 캘린더 점 색과 "10월 4일의 나 · 화남"에 써요
          items:
            $ref: '#/components/schemas/Emotion'
        level:
          $ref: '#/components/schemas/RecordLevel'
      example:
        anchorDate: '2026-10-04'
        scope: DAY
        windowStart: '2026-10-04'
        windowEnd: '2026-10-04'
        diaryCount: 1
        messengerWeeks: 0
        emotions: [ANGRY]
        level: ENOUGH
    Shortcut:
      allOf:
        - $ref: '#/components/schemas/PersonaWindow'
        - type: object
          required: [key]
          properties:
            key:
              $ref: '#/components/schemas/ShortcutKey'
    ShortcutList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 3
          maxItems: 3
          items:
            $ref: '#/components/schemas/Shortcut'

    # ───────── 대화 · 리포트 ─────────
    ChatCreate:
      type: object
      required: [anchorDate, scope]
      properties:
        anchorDate:
          type: string
          format: date
          description: '`/personas/shortcuts`가 준 값 또는 캘린더에서 직접 고른 날짜. 오늘로부터 365일 전 ~ 오늘'
        scope:
          $ref: '#/components/schemas/PersonaScope'
        shortcutKey:
          allOf:
            - $ref: '#/components/schemas/ShortcutKey'
          description: 바로가기로 시작했을 때만 보내요. 직접 고른 날짜면 생략해요
        forCouple:
          type: boolean
          default: false
          description: 커플 모드의 같은 날 비교를 위한 세션이면 `true`. 커플이 연결 · 양측 동의 상태여야 해요
    ChatSession:
      type: object
      required: [id, status, mode, scope, anchorDate, windowStart, windowEnd, level, startedAt]
      properties:
        id:
          type: string
          format: uuid
        status:
          type: string
          enum: [PREPARING, READY, FAILED]
          description: '`PREPARING`이면 시점 분석 중, `READY`면 대화할 수 있어요, `FAILED`면 `failureCode`를 보고 다시 시도해요'
        preparingStep:
          type: string
          nullable: true
          enum: [COLLECT, MASK, ANALYZE, BUILD, null]
          description: |
            `PREPARING`일 때의 단계예요. 서버가 단계를 추적하지 못하면 `null`이고, 앱은 단계 표시를 순서대로 흉내 내요.
            기록 모으기 `COLLECT`, 민감정보 가리기 `MASK`, 말투와 대화 방식 분석하기 `ANALYZE`, 그때의 나 완성하기 `BUILD`
        failureCode:
          type: string
          nullable: true
          description: |
            `FAILED`일 때의 이유예요. `AI_UNAVAILABLE`(AI에 닿지 못했어요) · `AI_REFUSED`(AI의 안전 장치가 거절했어요) ·
            `AI_BAD_RESPONSE`(AI의 답을 읽지 못했어요) · `PREPARING_TIMEOUT`(10분이 지나도 안 끝났어요) · `INTERNAL_ERROR`.
            앱은 새 세션을 만들어 다시 시도해요.
          example: AI_UNAVAILABLE
        mode:
          type: string
          enum: [PERSONAL, COUPLE]
        coupleId:
          type: string
          format: uuid
          nullable: true
        scope:
          $ref: '#/components/schemas/PersonaScope'
        shortcutKey:
          type: string
          nullable: true
          enum: [ONE_MONTH, SIX_MONTHS, ONE_YEAR, null]
        anchorDate:
          type: string
          format: date
        windowStart:
          type: string
          format: date
        windowEnd:
          type: string
          format: date
        level:
          $ref: '#/components/schemas/RecordLevel'
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
      example:
        id: 5b8c0d1e-2f3a-4b4c-9d5e-6f7a8b9c0d1e
        status: READY
        preparingStep: null
        failureCode: null
        mode: PERSONAL
        coupleId: null
        scope: AROUND
        shortcutKey: ONE_MONTH
        anchorDate: '2026-09-07'
        windowStart: '2026-08-24'
        windowEnd: '2026-09-21'
        level: ENOUGH
        startedAt: '2026-10-06T21:30:00+09:00'
        endedAt: null
    ChatListItem:
      type: object
      required: [id, scope, anchorDate, level, status, startedAt, lastMessageAt]
      properties:
        id:
          type: string
          format: uuid
        scope:
          $ref: '#/components/schemas/PersonaScope'
        shortcutKey:
          type: string
          nullable: true
          enum: [ONE_MONTH, SIX_MONTHS, ONE_YEAR, null]
          description: 바로가기로 시작했으면 "1개월" 같은 칩에 써요. 날짜를 직접 골랐으면 `null`이에요
        anchorDate:
          type: string
          format: date
          description: '"10월 4일의 나", "3개월 전의 나" 같은 제목은 앱이 `scope` · `anchorDate`로 만들어요'
        emotions:
          type: array
          description: 그날의 감정 태그 (`DAY`일 때만)
          items:
            $ref: '#/components/schemas/Emotion'
        level:
          $ref: '#/components/schemas/RecordLevel'
        status:
          type: string
          enum: [PREPARING, READY, FAILED]
        lastMessagePreview:
          type: string
          nullable: true
          description: 마지막 메시지 한 줄 미리보기. 아직 대화가 없으면 `null`
        lastMessageAt:
          type: string
          format: date-time
          description: 마지막 메시지 시각. 대화가 없으면 세션을 만든 시각
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
          nullable: true
      example:
        id: 5b8c0d1e-2f3a-4b4c-9d5e-6f7a8b9c0d1e
        scope: DAY
        shortcutKey: null
        anchorDate: '2026-10-04'
        emotions: [ANGRY]
        level: ENOUGH
        status: READY
        lastMessagePreview: 그날 진짜 많이 속상했어, 근데 말을 못 꺼내겠더라
        lastMessageAt: '2026-10-05T21:10:00+09:00'
        startedAt: '2026-10-05T21:00:00+09:00'
        endedAt: null
    ChatList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChatListItem'
    ChatMessage:
      type: object
      required: [id, seq, role, content, createdAt]
      properties:
        id:
          type: integer
          format: int64
        seq:
          type: integer
          description: 세션 안에서 1부터 늘어나는 순서
        role:
          type: string
          enum: [USER, PERSONA]
        content:
          type: string
        createdAt:
          type: string
          format: date-time
    MessageList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
    SendMessage:
      type: object
      required: [content]
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 2000
    ChatReply:
      type: object
      required: [userMessage, personaMessage]
      description: |
        답변이 저장된 뒤의 결과예요. `safety`는 위기 신호를 감지했을 때만 있어요 (JSON 응답에서만 써요. SSE에서는 `safety` 이벤트로 먼저 와요).
      properties:
        userMessage:
          $ref: '#/components/schemas/ChatMessage'
        personaMessage:
          $ref: '#/components/schemas/ChatMessage'
        safety:
          $ref: '#/components/schemas/SafetyNotice'
    SafetyNotice:
      type: object
      required: [reason, hotlines]
      description: 대화에서 위기 신호를 감지했을 때의 안내예요. 번호는 서버에서 내려줘서 앱 배포 없이 바꿀 수 있어요
      properties:
        reason:
          type: string
          enum: [DISTRESS]
          description: 지금은 한 가지뿐이에요
        hotlines:
          type: array
          items:
            type: object
            required: [name, phone, hours]
            properties:
              name:
                type: string
              phone:
                type: string
              hours:
                type: string
      example:
        reason: DISTRESS
        hotlines:
          - name: 자살예방 상담전화
            phone: '109'
            hours: 24시간
          - name: 정신건강 위기상담전화
            phone: 1577-0199
            hours: 24시간
    EndChatResult:
      type: object
      required: [chatId, endedAt, durationMinutes, reportStatus]
      properties:
        chatId:
          type: string
          format: uuid
        endedAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
          example: 18
        reportStatus:
          type: string
          enum: [GENERATING, READY]
    Report:
      type: object
      required: [id, chatId, mode, scope, anchorDate, durationMinutes, oneLineSummary, createdAt]
      properties:
        id:
          type: string
          format: uuid
        chatId:
          type: string
          format: uuid
        mode:
          type: string
          enum: [PERSONAL, COUPLE]
        scope:
          $ref: '#/components/schemas/PersonaScope'
        anchorDate:
          type: string
          format: date
          description: '"3개월 전의 나", "10월 4일의 나"의 날짜는 앱이 이 값으로 만들어요'
        durationMinutes:
          type: integer
          example: 18
        pastConcern:
          type: string
          nullable: true
          description: 당시 고민. 개인 모드에만 있고 커플 모드 세션은 `null`이에요
        presentChange:
          type: string
          nullable: true
          description: 현재 변화. 개인 모드에만 있고 커플 모드 세션은 `null`이에요
        oneLineSummary:
          type: string
          maxLength: 100
        memorySummary:
          type: string
          nullable: true
          description: '"내가 기억하는 그날". 커플 모드 세션에만 있어요'
        createdAt:
          type: string
          format: date-time
      example:
        id: 9e8d7c6b-5a49-4837-a625-140f3e2d1c0b
        chatId: 5b8c0d1e-2f3a-4b4c-9d5e-6f7a8b9c0d1e
        mode: PERSONAL
        scope: AROUND
        anchorDate: '2026-07-06'
        durationMinutes: 18
        pastConcern: 학기 말에 진로가 정해지지 않아 막막했지만, 겉으로는 티를 내지 않았어요.
        presentChange: 지금은 방향을 조금 잡았고, 걱정을 혼자 안고 있지 않게 됐어요.
        oneLineSummary: 막막함은 줄고, 해 본 일은 늘었어요.
        memorySummary: null
        createdAt: '2026-10-06T21:49:00+09:00'
    ReportPending:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [GENERATING]

    # ───────── 커플 ─────────
    CoupleState:
      type: object
      required: [status, compareOpen]
      properties:
        status:
          type: string
          enum: [NONE, PENDING, EXPIRED, CONNECTED]
          description: |
            `NONE` 연결 없음, `PENDING` 코드를 만들고 상대를 기다리는 중, `EXPIRED` 코드가 24시간이 지나 만료됨(`couples.code_expires_at`로 계산),
            `CONNECTED` 두 계정이 연결됨. 해제하면 `NONE`으로 돌아가요.
        coupleId:
          type: string
          format: uuid
          nullable: true
        myRole:
          type: string
          nullable: true
          enum: [INVITER, INVITEE]
          description: 코드를 만든 쪽인지 입력한 쪽인지 (`couple_members.role`)
        invite:
          type: object
          nullable: true
          description: 내가 코드를 만든 쪽이고 아직 연결 전일 때만 있어요
          required: [code, expiresAt]
          properties:
            code:
              type: string
              example: DU-7K4Q-2M9X
            expiresAt:
              type: string
              format: date-time
        me:
          type: object
          nullable: true
          required: [nickname, consented]
          properties:
            nickname:
              type: string
              example: 서연
            consented:
              type: boolean
        partner:
          type: object
          nullable: true
          description: 연결 전에는 `null`이에요
          required: [nickname, consented]
          properties:
            nickname:
              type: string
              example: 도윤
            consented:
              type: boolean
        connectedAt:
          type: string
          format: date-time
          nullable: true
        compareOpen:
          type: boolean
          description: 같은 날 비교(함께 볼 날 고르기 · 두 시점 비교)를 열 수 있는지. 연결됨 + 양측 동의 + 철회 없음일 때만 `true`
      example:
        status: CONNECTED
        coupleId: 2c3d4e5f-6a7b-4c8d-9e0f-1a2b3c4d5e6f
        myRole: INVITER
        invite: null
        me:
          nickname: 서연
          consented: true
        partner:
          nickname: 도윤
          consented: true
        connectedAt: '2026-10-06T19:40:00+09:00'
        compareOpen: true
    AcceptInviteRequest:
      type: object
      required: [inviteCode]
      properties:
        inviteCode:
          type: string
          pattern: '^DU-[A-Z0-9]{4}-[A-Z0-9]{4}$'
          example: DU-7K4Q-2M9X
    ConsentRequest:
      type: object
      required: [agreed]
      properties:
        agreed:
          type: boolean
          enum: [true]
          description: 동의 화면의 체크 후 "동의하고 계속하기"를 눌렀을 때 `true`. 철회는 `POST /couples/revoke`로 해요
    CoupleDay:
      type: object
      required: [date, myEmotions, partnerEmotions, recommended]
      properties:
        date:
          type: string
          format: date
        myEmotions:
          type: array
          items:
            $ref: '#/components/schemas/Emotion'
        partnerEmotions:
          type: array
          items:
            $ref: '#/components/schemas/Emotion'
        recommended:
          type: boolean
          description: 감정 태그가 대비되는 날(특히 다툰 날)이라 서버가 먼저 추천하는 날
      example:
        date: '2026-10-04'
        myEmotions: [ANGRY]
        partnerEmotions: [ANGRY]
        recommended: true
    CoupleDayList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CoupleDay'
    CoupleComparison:
      type: object
      required: [status, anchorDate, scope]
      properties:
        status:
          type: string
          enum: [NOT_STARTED, IN_PROGRESS, WAITING_PARTNER, READY]
          description: |
            `NOT_STARTED` 내가 아직 이 날의 나와 대화하지 않았어요, `IN_PROGRESS` 대화 중이에요,
            `WAITING_PARTNER` 나는 끝냈고 상대를 기다려요, `READY` 두 사람이 모두 끝나서 비교할 수 있어요
        anchorDate:
          type: string
          format: date
        scope:
          $ref: '#/components/schemas/PersonaScope'
        chatId:
          type: string
          format: uuid
          nullable: true
          description: 내 세션 ID. 아직 시작하지 않았으면 `null`
        me:
          type: object
          nullable: true
          description: '"내가 기억하는 그날"'
          properties:
            memorySummary:
              type: string
              nullable: true
        partner:
          type: object
          nullable: true
          description: '"도윤이 기억하는 그날". 상대가 끝나기 전에는 `memorySummary`가 `null`이에요'
          properties:
            nickname:
              type: string
            memorySummary:
              type: string
              nullable: true
        gapSummary:
          type: string
          nullable: true
          description: '"두 사람의 간극" 한 줄. `READY`일 때만 있어요'
      example:
        status: READY
        anchorDate: '2026-10-04'
        scope: DAY
        chatId: 5b8c0d1e-2f3a-4b4c-9d5e-6f7a8b9c0d1e
        me:
          memorySummary: 먼저 연락을 끊은 건 서운해서였는데, 그 마음을 설명하지 못해서 더 화가 났어요.
        partner:
          nickname: 도윤
          memorySummary: 갑자기 연락이 끊겨서 무슨 잘못을 했는지 몰라 불안했고, 그래서 다그치듯 물었어요.
        gapSummary: 서운함은 침묵으로, 불안함은 다그침으로 전해졌어요.
